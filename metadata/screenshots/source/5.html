<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}</style></head><body><div style="width: 430px; height: 932px; box-sizing: border-box; padding: 84px 34px 0; background: #F5F5F7; color: #0B0B0F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; overflow: hidden">

        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1F9D4D"></circle><path d="M7.5 12.5l3 3 6-6.5" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div>Copied</div>
      </div>
      <div style="position: relative; align-self: stretch; margin-top: 54px">
        <div style="position: absolute; left: 34px; top: -64px; height: 50px; padding: 0 22px; border-radius: 14px; background: #0B0B0F; color: #FFFFFF; font-size: 21px; font-weight: 600; display: flex; align-items: center">Paste</div>
        <div style="position: absolute; left: 62px; top: -20px; width: 16px; height: 16px; background: #0B0B0F; transform: rotate(45deg)"></div>
        <div style="display: flex; align-items: center; height: 78px; padding: 0 26px; border-radius: 39px; background: #FFFFFF; box-shadow: 0 10px 40px rgba(11,11,15,0.10); font-size: 23px; color: #9A9AA5">
          <div style="width: 3px; height: 34px; border-radius: 2px; background: #4B4DED; margin-right: 10px"></div>
          <div>Message</div>
        </div>
      </div>
      <div style="align-self: flex-end; max-width: 86%; padding: 18px 24px; border-radius: 30px 30px 8px 30px; background: #4B4DED; color: #FFFFFF; font-size: 23px; line-height: 1.3; font-weight: 500">I will be about fifteen minutes late. Please start without me.</div>
    </div>
  </div>
</div>
